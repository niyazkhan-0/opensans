services:

  postgres:
    image: pgvector/pgvector:pg17    # change pg17 to match your PostgreSQL version
    container_name: opensans-postgres
    environment:
      POSTGRES_DB: opensans-media
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8275097876
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio
    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  minio_data:
  postgres_data: